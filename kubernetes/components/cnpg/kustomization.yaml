---
apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
components:
  - ./base
resources:
  - ./objectstore.yaml
  - ./scheduledbackup.yaml
  - ./secret.yaml
patches:
  - target:
      group: postgresql.cnpg.io
      version: v1
      kind: Cluster
    patch: |-
      - op: add
        path: /spec/plugins
        value:
          - name: barman-cloud.cloudnative-pg.io
            isWALArchiver: true
            parameters:
              barmanObjectName: ${APP}-postgres
