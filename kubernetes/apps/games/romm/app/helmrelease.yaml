---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app romm
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    controllers:
      romm:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: docker.io/rommapp/romm
              tag: 5.4.1
            env:
              TZ: America/Toronto
              ROMM_DB_DRIVER: postgresql
              DB_HOST: romm-postgres-rw.games.svc.cluster.local
              DB_PORT: 5432
              DB_NAME: romm
              DB_USER:
                valueFrom:
                  secretKeyRef:
                    name: romm-postgres-app
                    key: username
              DB_PASSWD:
                valueFrom:
                  secretKeyRef:
                    name: romm-postgres-app
                    key: password
              HASHEOUS_API_ENABLED: true
            envFrom:
              - secretRef:
                  name: romm-secret
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  tcpSocket:
                    port: &port 8080
                  periodSeconds: 10
                  timeoutSeconds: 1
                  failureThreshold: 3
              readiness: *probes
              startup:
                enabled: true
                custom: true
                spec:
                  tcpSocket:
                    port: *port
                  failureThreshold: 30
                  periodSeconds: 10
            resources:
              requests:
                cpu: 50m
              limits:
                memory: 2Gi
    service:
      app:
        controller: romm
        ports:
          http:
            port: *port
    route:
      app:
        hostnames: ["{{ .Release.Name }}.${SECRET_DOMAIN}"]
        parentRefs:
          - name: external
            namespace: kube-system
            sectionName: https
        rules:
          - backendRefs:
              - identifier: app
                port: *port
    persistence:
      data:
        existingClaim: *app
        globalMounts:
          - path: /romm/assets
            subPath: assets
          - path: /romm/config
            subPath: config
          - path: /romm/resources
            subPath: resources
          - path: /redis-data
            subPath: redis-data
      library:
        type: custom
        volumeSpec:
          nfs:
            server: 192.168.86.200
            path: "/mnt/vault/media"
        globalMounts:
          - path: /romm/library
            subPath: games
